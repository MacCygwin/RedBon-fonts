<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Interface font: SF Pro Text if you installed it yourself, otherwise Inter -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- Monospace: Fira Code, with the Nerd symbols for prompt icons -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Fira Code</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <!-- Anything that asks for an SF font by name gets a free look-alike, but only if SF itself isn't installed -->
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Rounded</string></test>
    <edit name="family" mode="append" binding="weak"><string>Nunito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Text</string></test>
    <edit name="family" mode="append" binding="weak"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Display</string></test>
    <edit name="family" mode="append" binding="weak"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <edit name="family" mode="append" binding="weak"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Compact</string></test>
    <edit name="family" mode="append" binding="weak"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>Fira Code</string></edit>
  </match>
</fontconfig>
